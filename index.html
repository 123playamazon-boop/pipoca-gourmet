*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Karla,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
.display{font-family:Fraunces,Georgia,serif}
img{max-width:100%;display:block}
.wrap{max-width:560px;margin:0 auto;padding:0 18px}

/* header */
header.bar{position:sticky;top:0;z-index:20;background:rgba(255,253,250,.96);backdrop-filter:blur(6px);border-bottom:1px dashed var(--line);padding:11px 0}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.earn small{font-size:11px;font-weight:800;color:var(--gold);text-transform:uppercase;letter-spacing:.3px}
.earn .amt{font-family:"Space Mono",ui-monospace,monospace;font-size:26px;font-weight:800;color:var(--gold);line-height:1;letter-spacing:-1px}
.earn .amt sup{font-size:13px;opacity:.6;vertical-align:top}
.level{flex:none;background:var(--sec);color:#6a4a0f;border-radius:999px;padding:7px 14px;font-size:12px;font-weight:800;white-space:nowrap}
.pbar{position:relative;margin-top:11px;height:9px;border-radius:999px;background:var(--sec);overflow:visible}
.pfill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width .5s}
.pnub{position:absolute;top:-9px;font-size:16px;transition:left .5s;transform:translateX(-50%)}

/* screen — top-aligned so the question + button stay near the top (mobile-friendly) */
.screen{padding:16px 0 36px;animation:rise .35s ease both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h1.q{font-family:Fraunces,serif;font-weight:800;font-size:23px;line-height:1.28;margin:4px 0 2px}
@media(min-width:480px){h1.q{font-size:26px}}
.lede{font-size:17px;font-weight:600;margin:14px 0 0;color:var(--ink)}
.hl{color:var(--gold);font-weight:900;white-space:nowrap}
.hlr{color:var(--red);font-weight:900;white-space:nowrap;text-decoration:underline;text-decoration-color:var(--red);text-underline-offset:3px}
.hlg{color:var(--gold);font-weight:900;text-decoration:underline;text-decoration-color:var(--gold);text-underline-offset:3px}
.sub{color:var(--muted);font-size:14px;margin-top:10px}
.hero-img{width:112%;margin:16px -6% 0;border-radius:16px}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:var(--gold)}

/* options */
.opts{display:flex;flex-direction:column;gap:11px;margin-top:20px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:15px;padding:16px 16px;font-size:15.5px;font-weight:700;color:var(--ink);cursor:pointer;transition:border-color .15s;box-shadow:0 1px 0 rgba(0,0,0,.02);touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.opt:active{border-color:var(--gold);background:var(--sec)}
.opt .tick{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line)}
@media(hover:hover){.opt:hover{border-color:var(--gold);transform:translateY(-1px)}.opt:hover .tick{border-color:var(--gold)}}

/* form */
.field{margin-top:22px}
.field label{display:block;font-weight:800;font-size:14px;margin-bottom:8px}
.field input{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:16px;font-size:16px;font-family:inherit;background:var(--card)}
.field input:focus{outline:none;border-color:var(--gold)}

/* reward chip */
.reward{display:flex;align-items:center;gap:12px;background:#f3fbf4;border:1.5px solid #cdebd4;border-radius:15px;padding:14px 16px;margin-top:20px}
.reward .emo{font-size:26px}
.reward b{display:block;font-size:15px}
.reward small{color:var(--green);font-weight:800}

/* content cards */
.tiles{display:grid;grid-template-columns:1fr;gap:11px;margin-top:20px}
.tile{display:flex;gap:13px;align-items:flex-start;background:var(--card);border:1.5px solid var(--line);border-radius:15px;padding:15px}
.tile .emo{font-size:24px;flex:none}
.tile b{font-size:15.5px}
.tile p{margin:3px 0 0;font-size:13.5px;color:var(--muted)}

/* calc table */
.calc{margin-top:20px;border:1.5px solid var(--line);border-radius:16px;overflow:hidden;background:var(--card)}
.calc .row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 15px;border-bottom:1px solid var(--line);font-size:14.5px}
.calc .row:last-child{border-bottom:0}
.calc .row .l{display:flex;align-items:center;gap:9px;font-weight:700;color:var(--muted)}
.calc .row .v{font-weight:800;text-align:right}
.calc .row.big{background:#fff6e6}
.calc .row.big .v{color:var(--gold);font-size:17px}

/* flavors */
.flav{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.fcard{background:var(--card);border:1.5px solid var(--line);border-radius:16px;overflow:hidden}
.fcard img{width:100%;aspect-ratio:1/1;object-fit:cover}
.fcard .fb{padding:11px 12px}
.fcard b{font-size:14.5px}
.fcard p{margin:2px 0 0;font-size:12px;color:var(--muted)}

/* timeline */
.tl{margin-top:20px;display:flex;flex-direction:column;gap:14px}
.tli{background:var(--card);border:1.5px solid var(--line);border-radius:16px;overflow:hidden}
.tli img{width:100%;aspect-ratio:16/9;object-fit:cover}
.tli .tb{padding:14px 16px}
.tli .phase{font-size:11px;font-weight:800;color:var(--gold);letter-spacing:.3px}
.tli .ttl{font-family:Fraunces,serif;font-weight:800;font-size:17px;margin:2px 0 2px}
.tli .stt{font-size:11px;font-weight:800;color:var(--green);text-transform:uppercase;letter-spacing:.3px}
.tli p{margin:7px 0 0;font-size:13.5px;color:var(--muted)}

.load{text-align:center;padding:40px 0}
.spin{width:54px;height:54px;border:5px solid var(--sec);border-top-color:var(--gold);border-radius:50%;margin:0 auto 20px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.loadbar{height:9px;border-radius:999px;background:var(--sec);overflow:hidden;margin:18px auto 0;max-width:320px}
.loadbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold2));animation:lb 3.4s ease forwards}

.vwrap{margin-top:16px;border-radius:16px;overflow:hidden;background:#000;aspect-ratio:16/9}
.vwrap iframe{width:100%;height:100%;border:0;display:block}
.gifts{margin-top:18px;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:16px}
.gifts h3{font-family:Fraunces,serif;margin:0 0 10px;font-size:18px}
.gline{display:flex;align-items:flex-start;gap:11px;padding:10px 0;border-bottom:1px dashed var(--line)}

.gline.totalv{border-bottom:0;border-top:2px solid var(--line);margin-top:4px;padding-top:12px}
.gline .gv.totalp{color:var(--gold);text-decoration:none;font-size:16px}

.pricebox .once{color:var(--muted);font-size:13px;margin-top:2px}

.instr{display:flex;gap:14px;align-items:center;margin-top:18px;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:14px}
.instr img{width:92px;height:92px;flex:none;border-radius:14px;object-fit:cover}

.ugc{margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:12px}

.step b{font-size:14.5px}
.step p{margin:3px 0 0;font-size:13px;color:var(--muted)}
/* social proof — WhatsApp-style prints */
.proof{margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.proof figure{margin:0;background:#e5ddd5;border:1.5px solid var(--line);border-radius:16px;overflow:hidden}
.proof img{width:100%;display:block}

.faq{margin-top:16px;display:grid;gap:8px}
.faq details{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:0 14px}
.faq summary{list-style:none;cursor:pointer;font-weight:800;font-size:14px;padding:14px 0;position:relative;padding-right:24px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";position:absolute;right:2px;top:12px;font-size:20px;color:var(--gold);font-weight:900}
.faq details[open] summary::after{content:"–"}
.faq p{margin:0 0 14px;font-size:13.5px;color:var(--muted);line-height:1.5}

/* CTA — on quiz screens it sits INLINE right under the content (button follows what you just filled) */
.ctawrap{padding:18px 0 10px}
.ctawrap .inner{max-width:560px;margin:0 auto}
/* intro & offer are LONG → fixed sticky bar at the bottom so the button is always visible */
body.intro .ctawrap,body.offer .ctawrap{position:fixed;left:0;right:0;bottom:0;z-index:40;background:linear-gradient(to top,var(--bg) 70%,transparent);padding:12px 18px 16px}

.urg{text-align:center;font-size:12px;font-weight:800;color:var(--red);margin-top:4px}
.disc{font-size:10.5px;color:var(--muted);margin-top:14px;text-align:center;line-height:1.45}
.center{text-align:center}
</style>
